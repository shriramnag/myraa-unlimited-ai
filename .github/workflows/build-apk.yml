name: Build SHIV AI — MYRAA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Signed Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses (Ubuntu 24.04 Compatible)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install --legacy-peer-deps || npm install
          npm run build
          rm -rf dist/assets/aistudio/*.zip || true
          mkdir -p app/src/main/assets/public
          cp -r public/* app/src/main/assets/public/ || true
          cp -r dist/* app/src/main/assets/public/
          rm -rf app/src/main/assets/public/assets/aistudio/*.zip || true

      - name: Prepare Keystore & Gradle Config for Public Maven CI
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Shri Ram Nag,OU=SHIV AI,O=MYRAA,L=Jodhpur,ST=Rajasthan,C=IN"
          fi

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MYRAA"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "ai.myraa.mobile"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.myraa.mobile"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 300
                  versionName = "3.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("${rootDir}/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
                  getByName("debug") {
                      storeFile = file("${rootDir}/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = true
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity:1.9.3")
          }
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload SHIV-AI-MYRAA Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIV-AI-MYRAA-v3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SHIV-AI-MYRAA Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIV-AI-MYRAA-v3.0-release-apk
          path: app/build/outputs/apk/release/app-release.apk
