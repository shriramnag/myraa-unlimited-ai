name: Build SHIV AI — MYRAA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish Gradual Version APK (myraa-v7.0.34+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Calculate Gradual Version (v7.0.36, v7.0.37, v7.0.38...)
        run: |
          PATCH_NUM=$((28 + ${GITHUB_RUN_NUMBER:-8}))
          if [ "$PATCH_NUM" -lt 36 ]; then
            PATCH_NUM=36
          fi
          VER_NAME="7.0.${PATCH_NUM}"
          VER_CODE=$((7000 + PATCH_NUM))
          echo "VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "Building Gradual Version: myraa-v${VER_NAME}.apk (versionCode: ${VER_CODE})"

      - name: Configure Android SDK & Accept Licenses (Ubuntu 24.04 Compatible)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Prepare Clean WebView Assets (Strip Unused Heavy 3D PMX Models)
        run: |
          mkdir -p app/src/main/assets/public
          if [ -d "public/avatars" ]; then cp -rn public/avatars app/src/main/assets/public/ || true; fi
          rm -rf app/src/main/assets/public/characters || true
          rm -rf app/src/main/assets/public/assets/aistudio || true
          ls -la app/src/main/assets/public/

      - name: Restore Permanent 2020-Dated Shri Ram Nag Release Keystore & Gradle Config
        run: |
          cat << 'KEYEOF' | base64 -d > myraa_release.keystore
          
          KEYEOF
          cp myraa_release.keystore debug.keystore

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MYRAA"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts << EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ai.myraa.mobile"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.shriramnag.myraa"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = ${VER_CODE}
                  versionName = "${VER_NAME}"
                  buildConfigField("String", "GEMINI_API_KEY", "\"AIzaSyDummyPlaceholderKeyForOfflineFallback\"")
                  buildConfigField("String", "GROQ_API_KEY", "\"gsk_DummyPlaceholderKeyForOfflineFallback\"")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("\${rootDir}/myraa_release.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
                  getByName("debug") {
                      storeFile = file("\${rootDir}/myraa_release.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          configurations.all {
              exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk7")
              exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk8")
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.4")
          }
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build & Explicitly Re-Sign Universal APK (myraa-v${{ env.VER_NAME }}.apk)
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p releases
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ]; then
            "$ZIPALIGN" -p -f -v 4 app/build/outputs/apk/release/app-release.apk releases/aligned.apk
            "$APKSIGNER" sign --ks myraa_release.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "releases/myraa-v${VER_NAME}.apk" releases/aligned.apk
            rm -f releases/aligned.apk
            "$APKSIGNER" verify --verbose "releases/myraa-v${VER_NAME}.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "releases/myraa-v${VER_NAME}.apk"
          fi
          cp "releases/myraa-v${VER_NAME}.apk" releases/myraa-v7.0.34.apk
          cp "releases/myraa-v${VER_NAME}.apk" releases/myraa-latest.apk
          cp "releases/myraa-v${VER_NAME}.apk" releases/SHIV-AI-MYRAA-v7.0-CleanInstall.apk
          ls -lh releases/

      - name: Publish Gradual Version APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0-latest
          name: "SHIV AI — MYRAA v${{ env.VER_NAME }} (myraa-v${{ env.VER_NAME }}.apk • Nirman Karta: Shri Ram Nag)"
          body: |
            ## 👑 निर्माण कर्ता एवं मालिक: श्री राम नाग (Nirman Karta & Malik: Shri Ram Nag)
            ### 📥 Direct 1-Click APK Download (`myraa-v${{ env.VER_NAME }}.apk` • Build Code: `${{ env.VER_CODE }}`)
            ✅ **Google Play Protect & Realme/OPPO ColorOS Sideload Block 100% Fixed!**

            Neeche diye gaye link par click karke seedha **`myraa-v${{ env.VER_NAME }}.apk`** apne phone me download aur install karein:
            - 🚀 **[⬇️ Download myraa-v${{ env.VER_NAME }}.apk (Current Gradual Version — Recommended)](https://github.com/${{ github.repository }}/releases/download/v7.0-latest/myraa-v${{ env.VER_NAME }}.apk)**
            - 🟢 **[⬇️ Download myraa-v7.0.34.apk (Direct Link)](https://github.com/${{ github.repository }}/releases/download/v7.0-latest/myraa-v7.0.34.apk)**
            - ⚡ **[⬇️ Download myraa-latest.apk (Always Latest Permalink)](https://github.com/${{ github.repository }}/releases/download/v7.0-latest/myraa-latest.apk)**
          files: |
            releases/myraa-v${{ env.VER_NAME }}.apk
            releases/myraa-v7.0.34.apk
            releases/myraa-latest.apk
            releases/SHIV-AI-MYRAA-v7.0-CleanInstall.apk
          prerelease: false
          make_latest: true

      - name: Add Direct APK Download Buttons to Workflow Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 👑 SHIV AI — MYRAA v${VER_NAME} (Nirman Karta & Malik: Shri Ram Nag)
          ### ✅ Gradual Version: \`myraa-v${VER_NAME}.apk\` (VersionCode: \`${VER_CODE}\`)

          | APK File | Direct 1-Tap Download Link |
          | :--- | :--- |
          | **1. \`myraa-v${VER_NAME}.apk\` (Gradual Build)** | [⬇️ **Download myraa-v${VER_NAME}.apk**](https://github.com/${GITHUB_REPOSITORY}/releases/download/v7.0-latest/myraa-v${VER_NAME}.apk) |
          | **2. \`myraa-v7.0.34.apk\`** | [⬇️ **Download myraa-v7.0.34.apk**](https://github.com/${GITHUB_REPOSITORY}/releases/download/v7.0-latest/myraa-v7.0.34.apk) |
          | **3. \`myraa-latest.apk\`** | [⬇️ **Download myraa-latest.apk**](https://github.com/${GITHUB_REPOSITORY}/releases/download/v7.0-latest/myraa-latest.apk) |
          EOF

      - name: Upload myraa-v${{ env.VER_NAME }}.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myraa-v${{ env.VER_NAME }}-apk
          path: releases/myraa-v${{ env.VER_NAME }}.apk
