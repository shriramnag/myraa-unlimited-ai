name: Build SHIV AI — MYRAA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish Direct Download APK (v5.0 Google Live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses (Ubuntu 24.04 Compatible)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Verify Pre-Bundled Android WebView Assets
        run: |
          mkdir -p app/src/main/assets/public
          if [ -d "public/avatars" ]; then cp -rn public/avatars app/src/main/assets/public/ || true; fi
          if [ -d "public/characters" ]; then cp -rn public/characters app/src/main/assets/public/ || true; fi
          rm -rf app/src/main/assets/public/assets/aistudio || true
          ls -la app/src/main/assets/public/

      - name: Prepare V1+V2 Keystore & Gradle Config for Universal Phone Install
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -startdate "2020/01/01 00:00:00" \
            -validity 10000 \
            -dname "CN=Shri Ram Nag,OU=SHIV AI,O=MYRAA,L=Jodhpur,ST=Rajasthan,C=IN"

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MYRAA"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "ai.myraa.mobile"
              compileSdk = 34

              defaultConfig {
                  applicationId = project.findProperty("customAppId")?.toString() ?: "ai.myraa.mobile"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 500
                  versionName = "5.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("${rootDir}/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
                  getByName("debug") {
                      storeFile = file("${rootDir}/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = true
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          configurations.all {
              exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk7")
              exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk8")
          }

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity:1.9.3")
          }
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Debug, Release & CleanInstall APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/SHIV-AI-MYRAA-v5.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk releases/SHIV-AI-MYRAA-v5.0-release.apk
          gradle assembleRelease -PcustomAppId=ai.myraa.omni --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk releases/SHIV-AI-MYRAA-v5.0-CleanInstall.apk
          ls -lh releases/

      - name: Publish Direct 1-Click APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0-latest
          name: "SHIV AI — MYRAA v5.0 (Google Live API + Native Voice + Direct APK)"
          body: |
            ## 📥 Direct 1-Click APK Download (No ZIP Extraction Needed!)
            Supreme Owner: **Shri Ram Nag (श्री राम नाग)**

            Neeche diye gaye button par click karke seedha `.apk` download aur install karein:
            - 🚀 **[Download SHIV-AI-MYRAA-v5.0-CleanInstall.apk (Recommended — Zero Conflict)](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-CleanInstall.apk)**
            - 📱 **[Download SHIV-AI-MYRAA-v5.0-release.apk (Standard Package)](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-release.apk)**
            - 🛠️ **[Download SHIV-AI-MYRAA-v5.0-debug.apk (Debug Build)](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-debug.apk)**
          files: |
            releases/SHIV-AI-MYRAA-v5.0-CleanInstall.apk
            releases/SHIV-AI-MYRAA-v5.0-release.apk
            releases/SHIV-AI-MYRAA-v5.0-debug.apk
          prerelease: false
          make_latest: true

      - name: Add Direct APK Download Buttons to Workflow Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🚀 SHIV AI — MYRAA v5.0 Direct APK Downloads
          **Supreme Owner:** Shri Ram Nag (श्री राम नाग)

          👉 **Mobile par bina ZIP ke seedha `.apk` download karne ke liye neeche click karein:**

          | APK Variant | Direct 1-Tap Download Link |
          | :--- | :--- |
          | **1. CleanInstall APK (Recommended - 100% Zero Conflict)** | [⬇️ **Download SHIV-AI-MYRAA-v5.0-CleanInstall.apk**](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-CleanInstall.apk) |
          | **2. Release APK (Standard v5.0.0)** | [⬇️ **Download SHIV-AI-MYRAA-v5.0-release.apk**](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-release.apk) |
          | **3. Debug APK** | [⬇️ **Download SHIV-AI-MYRAA-v5.0-debug.apk**](https://github.com/${{ github.repository }}/releases/download/v5.0-latest/SHIV-AI-MYRAA-v5.0-debug.apk) |
          EOF

      - name: Upload SHIV-AI-MYRAA CleanInstall APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHIV-AI-MYRAA-v5.0-CleanInstall-APK
          path: releases/SHIV-AI-MYRAA-v5.0-CleanInstall.apk

      - name: Upload SHIV-AI-MYRAA Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHIV-AI-MYRAA-v5.0-release-apk
          path: releases/SHIV-AI-MYRAA-v5.0-release.apk

      - name: Upload SHIV-AI-MYRAA Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHIV-AI-MYRAA-v5.0-debug-apk
          path: releases/SHIV-AI-MYRAA-v5.0-debug.apk
