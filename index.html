<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#02020a" />
    <title>SHIV AI — MYRAA v7.0.36 (Shri Ram Nag)</title>
    <link rel="icon" type="image/png" href="/avatars/ic_launcher_round.png" />
    <script>
      // Early WebView Storage & Global Error Safeguard (Prevents cold-boot SecurityError crashes)
      (function () {
        window.addEventListener("error", function (event) {
          console.warn("[MYRAA Boot Guard] Handled error:", event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          console.warn("[MYRAA Boot Guard] Handled rejection:", event.reason);
        });
        try {
          var testKey = "__myraa_storage_test__";
          window.localStorage.setItem(testKey, "1");
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var memStore = {};
          var safeStorage = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
            setItem: function (k, v) { memStore[k] = String(v); },
            removeItem: function (k) { delete memStore[k]; },
            clear: function () { memStore = {}; }
          };
          try {
            Object.defineProperty(window, "localStorage", { value: safeStorage, configurable: true });
          } catch (_) {}
        }
      })();
    </script>
  </head>
  <body class="bg-[#02020a] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
